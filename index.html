  // ゲームでも ready が飛び、親・サーバーが「起動成功した版」と誤認して自動修正を止めていた。
  // 追補 3（codex-review P1-1）: 件数として持ち、gamekit-ready の payload にも載せる。
  // 親はこれを HTTP 報告へ転送し、サーバーは「観測エラー付きの ready」を権威にしない
  // （報告 POST の到達順に依存せず、ランタイム自身の観測を根拠にできる）
  var selfErrorCount = 0;

  // ==========================================================================
  // rtfree-2（D-045）: エラーの発生源フィルタ
  //
  // 実害: ブラウザ拡張（MetaMask）が注入したスクリプトの例外を gamekit-error として親へ報告し、
  // 親が「ゲームが壊れた」と誤認して自動修正（= K3 の再生成 = クレジット消費）を走らせていた。
  //
  // 方針は**ホワイトリスト**（自分の URL だけ許可）。chrome-extension: / moz-extension: /
  // safari-web-extension: … といったスキームの**ブラックリスト列挙は採らない** — 拡張の種類は
  // 無限にあり列挙は必ず漏れるため（同じ教訓を D-044 の静的検査でも得ている）。
  // ==========================================================================

  // sandbox（allow-same-origin なし）の文書はオペークオリジンで location.origin が "null" に
  // なるため使えない。URL パーサ自体は文書のオリジン不透明性の影響を受けないので、
  // location.href を parse して scheme + host を自前で取り出す。
  var ownOriginPrefix = (function () {
    try {
      var parsed = new global.URL(String(global.location.href));
      if (!parsed.protocol || !parsed.host) {
        return null;
      }
      return parsed.protocol + "//" + parsed.host + "/";
    } catch (e) {
      return null;
    }
  })();

  function ownDocumentUrl() {
    try {
      return String(global.location.href);
    } catch (e) {
      return null;
    }
  }

  /**
   * error イベントの filename が「自分の文書（と同一オリジンの素材）」かどうか。
   * インラインスクリプトの例外では filename に文書 URL がそのまま入り、
   * 同一オリジンの外部スクリプト（/a/<versionId>/…）ではその URL が入る。どちらも許可する。
   *
   * filename が空文字 / undefined のケースは**自分由来と確認できない**ため false に倒す。
   * opaque-origin sandbox の WebKit では、自文書の inline 例外も filename="" / "Script error." /
   * 空 stack に匿名化され得るが、拡張等との区別が付かない。親はこの厳密な形だけを
   * opaque-unattributed として観測し、自動修正には使わない（D-058）。
   */
  function isOwnSourceUrl(url) {
    if (typeof url !== "string" || url === "") {
      return false;
    }
    if (ownOriginPrefix !== null) {
      return url.slice(0, ownOriginPrefix.length) === ownOriginPrefix;
    }
    // オリジンを取り出せない文書（about:blank 等）は文書 URL との完全一致だけを許可する
    var href = ownDocumentUrl();
    return href !== null && url === href;
  }

  /**
   * unhandledrejection には filename が無いため、reason.stack に自分のオリジンが現れるかで判定する
   * （ホワイトリスト方針は維持）。stack が無い / オリジンを取り出せない = **判定不能は「自分由来ではない」に倒す**。
   * 理由: 誤って自分由来とみなすと無駄な K3 再生成（実費）が発生する。一方こちらに倒しても
   * 診断報告自体は届き（自動修正だけしない）、ユーザーはチャットで修正を指示できる。
   * 起動失敗の主な形は同期例外（error イベント + filename あり）なので、取りこぼしは限定的。
   */
  function stackMentionsOwnSource(stack) {
    if (typeof stack !== "string" || stack === "" || ownOriginPrefix === null) {
      return false;
    }
    return stack.indexOf(ownOriginPrefix) !== -1;
  }

  function emptyAssetsManifest() {
    return { images: {}, sfx: {}, music: {}, videos: {}, models: {} };
  }

  // compose.ts が bridge スクリプトの直前に `var __GCN_ASSETS__ = {...};` を注入する
  // （games/runtime/gamekit.js の __GAMEKIT_ASSETS__ と同じ取り込み方式）。
  // 取り込んだらグローバルからは即座に消す（生成ロジックに生の変数を触らせない）
  var assetsManifest = (function () {
    var manifest = global.__GCN_ASSETS__;
    try {
      delete global.__GCN_ASSETS__;
    } catch (e) {}
    return manifest && typeof manifest === "object" ? manifest : emptyAssetsManifest();
  })();

  function sendPortMessage(payload) {
    if (!diagPort) {
      return;
    }
    try {
      diagPort.postMessage(payload);
    } catch (e) {
      // port が閉じている等は握りつぶす（診断送信の失敗でゲーム進行を止めない）
    }
  }

  /**
   * @param selfOrigin false を渡すと「自分由来と確認できないエラー」として扱う（既定は true）。
   *   親はこの印を見て自動修正（課金）を要求しない。**判定の権威は親**であり、これは親に渡す材料。
   */
  function reportError(message, stack, selfOrigin) {
    var isSelf = selfOrigin !== false;
    if (isSelf) {
      // 打ち切り（上限超過）の前に数える。上限に達したあとのエラーでも「起動できていない」
      // 事実は変わらないため、ready を送らない判断はここで確定させる
      if (selfErrorCount < MAX_SELF_ERROR_COUNT) {
        selfErrorCount += 1;
      }
      if (reportedErrorCount >= MAX_REPORTED_ERRORS) {
        return;
      }
      reportedErrorCount += 1;
    } else {
      if (foreignReportCount >= MAX_FOREIGN_REPORTS) {
        return;
      }
      foreignReportCount += 1;
    }
    var payload = {
      kind: "gamekit-error",
      versionId: diagVersionId,
      message: String(message === null || message === undefined ? "unknown error" : message),
      stack: stack ? String(stack) : undefined,
      // rtfree-2（D-045）: 親が自動修正を要求してよいかの材料。
      // selfOrigin=false → 自分のコード由来と確認できない（拡張由来の可能性）
      // afterReady=true  → gamekit-ready 送信後に起きた（= 起動には成功している）
      selfOrigin: isSelf,
      afterReady: readySent
    };
    if (!diagPort) {
      if (pendingErrors.length < MAX_PENDING_ERRORS) {
        pendingErrors.push(payload);
      }
      return;
    }
    sendPortMessage(payload);
  }

  function tryReportReady() {
    // rtfree-2（D-045 追補）: 自分由来のエラーを 1 件でも観測していたら ready は送らない。
    // 「起動時に真っ黒 → その後 ready」で自動修正が取りこぼされる後退を塞ぐ。
    // なおこの判定は ready 送信前だけに効く（送信後のエラーは readySent で先に return する）ため、
    // 「起動には成功したがプレイ中に落ちた」ゲームの ready は従来どおり有効。
    if (readySent || !diagPort || !readyFlag || selfErrorCount > 0) {
      return;
    }
    readySent = true;
    // selfErrorCount は上の条件により常に 0 だが、payload には明示的に載せる（追補 3・P1-1）。
    // 親・サーバーは「ready と一緒に運ばれてきた観測件数」だけを見れば良く、
    // gamekit-error の HTTP 報告が失われた／遅れて処理された場合でも判断が壊れない
    sendPortMessage({ kind: "gamekit-ready", versionId: diagVersionId, selfErrorCount: selfErrorCount });
  }

  // オペークオリジンでは event.origin が "null" になり送信元検証に使えないため、
  // MessageChannel の port を専有すること自体を認証代わりにする（gamekit.js と同じ考え方）。
  // compose.ts は正常形 HTML の <head> 直後へ注入し、stopImmediatePropagation で後続の
  // 生成ロジックへ同じイベント・port を渡さない。ただし malformed な要素順では先行 script を
  // 原理的に排除できないため、これは defense-in-depth であり権威的制御は Play.tsx 側が担う。
  global.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || data.kind !== "gamekit-init") {
      return;
    }
    event.stopImmediatePropagation();
    diagVersionId = typeof data.versionId === "string" ? data.versionId : null;
    if (data.saveData !== undefined && data.saveData !== null && typeof data.saveData === "object") {
      GCN.saveData = data.saveData;
    }
    diagPort = (event.ports && event.ports[0]) || null;
    if (!diagPort) {
      return;
    }
    for (var i = 0; i < pendingErrors.length; i++) {
      pendingErrors[i].versionId = diagVersionId;
      sendPortMessage(pendingErrors[i]);
    }
    pendingErrors = [];
    // rtfree-2（D-045 追補 3・codex-review P1-2）: onInit は **ready より必ず前**に呼ぶ。
    // onInit はセーブ復元などゲームの初期化を行う場所であり、ここで throw する = 起動できていない。
    // 以前は init が「load + rAF 2 回」より後に届くと readyFlag が既に true のため、
    // tryReportReady() → onInit の順になり、onInit の例外が afterReady:true 扱いで報告され、
    // 親が唯一の自動修正を抑制していた（D-045 で塞いだはずの「起動時の同期例外」の別経路）。
    // 例外は reportError 経由で selfErrorCount を増やすので、下の tryReportReady が ready を見送る。
    if (typeof GCN.onInit === "function") {
      try {
        GCN.onInit(GCN.saveData);
      } catch (e) {
        reportError(e && e.message ? e.message : String(e), e && e.stack);
      }
    }
    // init が ready 条件（load + rAF 2 回）より後に届いた場合はここで即送信、
    // 先に届いていた場合は load ハンドラ側の tryReportReady が後から送る（順序両対応）
    tryReportReady();
  });

  global.addEventListener("error", function (event) {
    // rtfree-2（D-045）: filename のホワイトリスト判定。自分の文書 / 同一オリジンの素材だけが
    // 自動修正の候補になる（拡張注入スクリプトは filename が chrome-extension://… 等で弾かれる）
    reportError(event.message, event.error && event.error.stack, isOwnSourceUrl(event.filename));
  });
  global.addEventListener("unhandledrejection", function (event) {
    var reason = event.reason;
    var stack = reason && reason.stack;
    reportError(
      reason && reason.message ? reason.message : String(reason),
      stack,
      stackMentionsOwnSource(stack)
    );
  });

  // ready 自動送信: load イベントの後、requestAnimationFrame を 2 回挟んでからフラグを立てる
  // （1 回だと最初の描画が済む前に ready を送ってしまい得るため。ゲート A の headless 検証が
  // 最初のスクリーンショットを撮る前に初期描画が済んでいることを期待するため 2 回待つ）。
  // rtfree-2（D-045 追補）: フラグが立っても、それまでに自分由来のエラーを観測していれば
  // tryReportReady が送信を見送る（= ready は「読み込み完了」ではなく「起動できた」の合図）。
  global.addEventListener("load", function () {
    global.requestAnimationFrame(function () {
      global.requestAnimationFrame(function () {
        readyFlag = true;
        tryReportReady();
      });
    });
  });

  // 送信抑制（ベストエフォートの UX 最適化）: GameKit と違い呼び出し頻度を生成コード側が
  // 握るため、善意のゲームループ内から毎フレーム呼ばれた場合の MessagePort 連投を減らす。
  // ただし bridge は未信頼のゲームコードと同一レルムにあり原理的に回避可能なので、これは
  // セキュリティ境界ではない。D1 POST の権威的な入力・レート・帯域制御は、信頼済み親ページの
  // Play.tsx が全ランタイム共通で行う（games/runtime/gamekit.js rt-9 の抑制も同じ位置づけ）。
  // bridge 自身は「先頭即時 + 2 秒クールダウン + 末尾フラッシュ」に抑制する。
  // クールダウン中の合成則はチャネルごとに異なる: サーバーはスコアを「受信した値のベスト」で
  // 保持するため、score は最大値を残す（100 → 0 と続いても 100 を失わない）。save は最新値が正。
  var THROTTLE_MS = 2000;
  var TEARDOWN_WINDOW_MS = 2000;
  // teardown 窓内の即時フラッシュ回数上限（チャネル別）。score は本文が数百バイトなので余裕を
  // 持たせ、save は最大 4KB 強 × keepalive の合計 in-flight 64KiB 制限（Fetch 仕様）を圧迫しない
  // よう 3 回に絞る（3 × 4KB ≒ 12KB。codex-review 反復 6 P2。現実のゲームの teardown 書き込みは
  // 1〜2 回であり実質失わない）
  var TEARDOWN_SCORE_FLUSH_BUDGET = 10;
  var TEARDOWN_SAVE_FLUSH_BUDGET = 3;
  // 通常の compose 出力では bridge を生成コードより前へ注入するため、この時点の Date.now /
  // setTimeout を閉じ込め、後からの偶発的な monkey-patch の影響を減らす（反復 6 P1）。ただし
  // 不正な HTML 配置等で先行 script が存在し得る以上、未汚染を権威性の根拠にはしない。
  var nativeDateNow = Date.now;
  var nativeSetTimeout = global.setTimeout.bind(global);
  function makeThrottledSender(send, coalesce, teardownBudgetMax) {
    var cooldown = false;
    var pending = null;
    function trigger(value) {
      cooldown = true;
      send(value);
      nativeSetTimeout(function () {
        cooldown = false;
        if (pending !== null) {
          var next = pending;
          pending = null;
          trigger(next);
        }
      }, THROTTLE_MS);
    }
    // teardown 用の即時フラッシュ窓。trusted なライフサイクルイベントを bridge のリスナーが
    // 観測したときだけ「時間窓 + 回数上限」が付与され、窓内のクールダウン中 submit は即時
    // フラッシュされる。これにより「ゲーム側の pagehide ハンドラが bridge のフラッシュより後に
    // GCN.save/score を呼ぶ」順序でも、teardown 中に同一チャネルへ複数回書く正当なゲーム
    // （pagehide リスナー 2 つ等。codex-review 反復 5 P1）でも最終値を取りこぼさない。
    // document.visibilityState は Object.defineProperty で偽装できる（反復 4 P1）ため判定に
    // 使わない — 窓は trusted イベント由来のみで、合成イベント・プロパティ偽装では開かない。
    // 乱用の上限は「実イベント 1 回あたり teardownBudgetMax 回・TEARDOWN_WINDOW_MS 以内」。
    // 上限超過後の書き込みは pending に合成されるだけになる（現実のゲームの teardown 書き込みは
    // 1〜2 回であり実質失わない）
    var teardownWindowUntil = 0;
    var teardownFlushBudget = 0;
    function submit(value) {
      if (cooldown) {
        pending = pending === null ? value : coalesce(pending, value);
        if (teardownFlushBudget > 0 && nativeDateNow() < teardownWindowUntil) {
          teardownFlushBudget--;
          submit.flush();
        }
        return;
      }
      trigger(value);
    }
    // ページ破棄時の取りこぼし防止: クールダウン待ちの未送信値を即時送信する
    // （タイマーはフレーム破棄で消えるため、待っていると親に届かない）
    submit.flush = function () {
      if (pending !== null) {
        var next = pending;
        pending = null;
        send(next);
      }
    };
    submit.armTeardownFlush = function () {
      teardownWindowUntil = nativeDateNow() + TEARDOWN_WINDOW_MS;
      teardownFlushBudget = teardownBudgetMax;
    };
    submit.disarmTeardownFlush = function () {
      teardownWindowUntil = 0;
      teardownFlushBudget = 0;
    };
    return submit;
  }
  var sendScoreThrottled = makeThrottledSender(function (score) {
    sendPortMessage({ kind: "gamekit-score", versionId: diagVersionId, score: score });
  }, function (a, b) {
    return a > b ? a : b;
  }, TEARDOWN_SCORE_FLUSH_BUDGET);
  var sendSaveThrottled = makeThrottledSender(function (json) {
    sendPortMessage({ kind: "gamekit-save", versionId: diagVersionId, data: json });
  }, function (a, b) {
    return b;
  }, TEARDOWN_SAVE_FLUSH_BUDGET);
  function flushPendingMessages() {
    sendScoreThrottled.flush();
    sendSaveThrottled.flush();
  }
  function armTeardownFlush() {
    sendScoreThrottled.armTeardownFlush();
    sendSaveThrottled.armTeardownFlush();
  }
  function disarmTeardownFlush() {
    sendScoreThrottled.disarmTeardownFlush();
    sendSaveThrottled.disarmTeardownFlush();
  }
  // pagehide は iOS Safari でも発火する。visibilitychange は保険（gamekit.js rt-9 と同じ）。
  // isTrusted ガード: ゲームコードが dispatchEvent(new Event("pagehide")) で合成イベントを
  // 連打してもフラッシュ（= スロットリングのバイパス経路）を踏めないようにする。
  // フラッシュ後に arm するのは、同じイベントディスパッチ内で後から動くゲーム側ハンドラの
  // GCN.save/score を即時送信するため（時間窓 + 回数上限。makeThrottledSender 参照）。
  // hidden 判定は偽装可能な visibilityState を見ず「pagehide = 破棄へ向かう」
  // 「visibilitychange = 表示状態が切り替わった」という trusted イベントの発生自体で扱う。
  global.addEventListener("pagehide", function (event) {
    if (event.isTrusted) {
      flushPendingMessages();
      armTeardownFlush();
    }
  });
  global.addEventListener("pageshow", function (event) {
    // bfcache から復帰したら通常のスロットリング動作に戻す（未使用の窓を破棄）
    if (event.isTrusted) {
      disarmTeardownFlush();
    }
  });
  global.addEventListener("visibilitychange", function (event) {
    // hidden への遷移か visible への復帰かを visibilityState で区別しない（偽装可能なため）。
    // どちら向きでも「未送信分をフラッシュして窓を付与」で統一する — visible 復帰時に短時間の
    // 即時送信を許すだけで、乱用には trusted イベントの実発生が必要なので有害でない
    if (event.isTrusted) {
      flushPendingMessages();
      armTeardownFlush();
    }
  });

  var GCN = {
    saveData: null,
    assets: assetsManifest,
    onInit: undefined,
    score: function (n) {
      if (typeof n !== "number" || !isFinite(n)) {
        reportError("GCN.score: 数値を渡してください");
        return;
      }
      sendScoreThrottled(Math.floor(n));
    },
    save: function (json) {
      if (typeof json !== "string") {
        reportError("GCN.save: JSON 文字列を渡してください（JSON.stringify 済みのもの）");
        return;
      }
      sendSaveThrottled(json);
    }
  };

  global.GCN = GCN;
})(window);
</script>

var state="title",score=0,best=0,combo=0,maxCombo=0,lastComboAt=-9;
var counts={p:0,g:0,m:0};
var notes=[],parts=[],pops=[],impacts=[];
var ac=null,AC=window.AudioContext||window.webkitAudioContext;
var master=null,noiseBuf=null,songStartP=0,nextStep=0;
var punchT=9,trauma=0,tGlobal=0,prevBeat=-1,goFlash=0;
var resultAge=0,rank="";
var RANKCOL={S:"#fab005",A:"#fa5252",B:"#339af0",C:"#adb5bd"};

// ---- 時計：Date.now ベースの現実時計。絶対時刻から毎フレーム計算するのでFPSに左右されない ----
function nowT(){return Date.now()/1000;}
function hitX(){return W*0.34;}
function potY(){return H*0.56;}
function potR(){return Math.min(Math.max(Math.min(W,H)*0.075,20),30);}
function charS(){return Math.min(Math.max(Math.min(W,H)*0.3,80),170);}
function popY(){return potY()-potR()-Math.min(H*0.14,80);}
function easeOutBack(k){var c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);}

// ================= 音声（すべて fail-open。失敗してもゲーム進行に影響しない） =================
function audioUp(){return !!(ac&&ac.state==="running");}
function initAudio(){
if(ac||!AC)return;
try{
var a=new AC();
var m=a.createGain();m.gain.value=0.9;
var comp=a.createDynamicsCompressor();
m.connect(comp);comp.connect(a.destination);
var len=a.sampleRate|0;
var nb=a.createBuffer(1,len,a.sampleRate);
var d=nb.getChannelData(0);
for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
master=m;noiseBuf=nb;ac=a;
}catch(e){ac=null;master=null;noiseBuf=null;}}
function unlockAudio(){
if(!ac)return;
try{if(ac.state==="suspended")ac.resume();}catch(e){}
try{if(ac.state!=="running"){
var s=ac.createBufferSource();s.buffer=ac.createBuffer(1,1,22050);
s.connect(ac.destination);s.start(0);}}catch(e){}}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0,t);
g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.001,t+a+dec);}
function kick(t){var o=ac.createOscillator(),g=ac.createGain();
o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);
env(g,t,0.004,0.85,0.22);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.3);}
function nz(t,dur,ft,f0,f1,peak,q){var s=ac.createBufferSource();s.buffer=noiseBuf;
var f=ac.createBiquadFilter();f.type=ft;f.Q.value=q||1;
f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
var g=ac.createGain();env(g,t,0.003,peak,dur);
s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.1);}
function snare(t){nz(t,0.14,"bandpass",1800,0,0.4,0.8);
var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=190;
env(g,t,0.003,0.25,0.08);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.12);}
function hat(t,v){nz(t,0.045,"highpass",7500,0,v,0.7);}
function tick(t,fq){var o=ac.createOscillator(),g=ac.createGain();o.type="square";
o.frequency.value=fq;env(g,t,0.002,0.16,0.05);
o.connect(g);g.connect(master);o.start(t);o.stop(t+0.08);}
function m2f(m){return 440*Math.pow(2,(m-69)/12);}
function lead(t,deg,dur){var o=ac.createOscillator(),g=ac.createGain();o.type="triangle";
o.frequency.value=m2f(72+SCALE[deg]);env(g,t,0.006,0.15,dur);
o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.1);}
function bass(t,off){var o=ac.createOscillator(),g=ac.createGain();o.type="triangle";
o.frequency.value=m2f(48+off);env(g,t,0.008,0.3,0.3);
o.connect(g);g.connect(master);o.start(t);o.stop(t+0.42);}
function finalChord(t){lead(t,0,0.9);lead(t,2,0.9);lead(t,4,0.9);bass(t,0);kick(t);}
function punchSfx(v){if(!audioUp())return;try{var t=ac.currentTime;
nz(t,0.1,"lowpass",2600,500,0.5*v,0.5);
var o=ac.createOscillator(),g=ac.createGain();
o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(70,t+0.09);
env(g,t,0.003,0.45*v,0.12);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.18);}catch(e){}}
function whiffSfx(){if(!audioUp())return;try{nz(ac.currentTime,0.16,"bandpass",1400,300,0.2,2);}catch(e){}}
function missSfx(){if(!audioUp())return;try{var t=ac.currentTime;
var o=ac.createOscillator(),g=ac.createGain();o.type="sine";
o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(240,t+0.16);
env(g,t,0.004,0.1,0.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.25);}catch(e){}}

// ---- スケジューラ（画面時計=Date.nowが主軸。音は後追い予約なので鳴らせない環境でも止まらない）----
function schedule(){
if(!ac||state!=="play")return;
if(ac.state==="suspended"){try{ac.resume();}catch(e){}}
var run=audioUp(),np=nowT(),guard=0,ol=0;
if(run){ol=ac.outputLatency||ac.baseLatency||0.015;if(ol>0.08)ol=0.08;}
while(guard++<96){
var tp=songStartP+nextStep*HALF;
if(tp-np>0.16)break;
if(run){try{scheduleStep(nextStep,nextStep/2,ac.currentTime+(tp-np)-ol);}catch(e){}}
nextStep++;}}
setInterval(function(){try{schedule();}catch(e){}},25);
function scheduleStep(st,bp,t){
if(st%2===0){
var b=bp;
if(b<CI){tick(t,b===0?880:(b===CI-1?1320:1040));}
else if(b<CI+BARS*4){
var rel=b-CI,bar=Math.floor(rel/4),bb=rel%4;
if(bb===0||bb===2)kick(t);
if(bb===1||bb===3)snare(t);
if(bb===0||bb===2)bass(t,ROOTS[bar%4]);
var m=MEL[bar%8][bb*2];if(m!==null)lead(t,m,0.22);
hat(t,0.15);}
else if(b===CI+BARS*4){finalChord(t);}
}else{
var pb=(st-1)/2;
if(pb>=CI&&pb<CI+BARS*4){
var rel2=pb-CI,bar2=Math.floor(rel2/4),bb2=rel2%4;
var mm=MEL[bar2%8][bb2*2+1];if(mm!==null)lead(t,mm,0.16);
if(bb2===3&&(bar2%2===1))kick(t);
hat(t,0.08);}}}

// ================= ゲーム進行（音声に一切依存しない） =================
function buildChart(){
notes.length=0;
for(var bar=0;bar<BARS;bar++){
var pat=PATS[bar%PATS.length];
for(var i=0;i<pat.length;i++){
var bt=CI+bar*4+pat[i];
notes.push({bt:bt,t:songStartP+bt*BEAT,st:0,mt:0,rot:Math.random()*6.28});}}}
function startGame(){
score=0;combo=0;maxCombo=0;lastComboAt=-9;
counts.p=0;counts.g=0;counts.m=0;
parts.length=0;pops.length=0;impacts.length=0;
songStartP=nowT()+0.4;nextStep=0;prevBeat=-1;goFlash=0;
buildChart();
trauma=0;punchT=9;resultAge=0;
state="play";
playVoice("vo_start");}
function showResult(){
state="result";resultAge=0;
var total=notes.length||1;
var rate=(counts.p+counts.g*0.5)/total;
rank=rate>=0.92?"S":rate>=0.78?"A":rate>=0.55?"B":"C";
if(score>best){best=score;
if(GCNOK){try{GCN.save(JSON.stringify({best:best}));}catch(e){}}}
if(GCNOK){try{GCN.score(score);}catch(e){}}
playVoice("vo_finish");}
function spawnShatter(x,y,per){
var i,a,v;
for(i=0;i<(per?26:14);i++){a=Math.random()*6.283;v=2+Math.random()*(per?7:4);
parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:0.22,l:1,sz:3+Math.random()*6,
col:Math.random()<0.5?"#b0703a":"#8a5427",spark:false,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.4});}
for(i=0;i<(per?18:8);i++){a=Math.random()*6.283;v=3+Math.random()*6;
parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:0.05,l:1,sz:2+Math.random()*3,
col:"hsl("+(40+Math.random()*20)+",100%,"+(60+Math.random()*20)+"%)",spark:true,rot:0,vr:0});}}
function tapRipple(x,y){
for(var i=0;i<12;i++){var a=Math.random()*6.283,v=1+Math.random()*4;
parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:0.04,l:1,sz:2+Math.random()*3,
col:"hsl("+((tGlobal*3)%360)+",95%,72%)",spark:true,rot:0,vr:0});}}
function tapPlay(){
var now=nowT(),tgt=null,bd=1e9,i;
for(i=0;i<notes.length;i++){var n=notes[i];if(n.st!==0)continue;
var ad=Math.abs(now-n.t);if(ad<=GOODWIN&&ad<bd){bd=ad;tgt=n;}}
if(tgt){
var per=bd<=PERF;
tgt.st=per?1:2;
if(per){counts.p++;score+=300;}else{counts.g++;score+=100;}
combo++;if(combo>maxCombo)maxCombo=combo;lastComboAt=now;
spawnShatter(hitX(),potY(),per);
impacts.push({x:hitX(),y:potY(),age:0,big:per});
pops.push({txt:per?"パーフェクト!":"グッド",col:per?"#ffd43b":"#4dabf7",age:0,x:hitX(),y:popY(),big:per});
if(per)trauma=Math.min(trauma+0.3,1);
punchT=0;punchSfx(per?1:0.7);
if(combo>0&&combo%25===0)pops.push({txt:combo+" コンボ!!",col:"#ff6b9d",age:0,x:W/2,y:H*0.3,big:true});
if(GCNOK){try{GCN.score(score);}catch(e){}}
}else{
combo=0;punchT=0;
pops.push({txt:"スカッ…",col:"#ced4da",age:0,x:hitX(),y:popY(),big:false});
whiffSfx();}}

// ---- 入力：pointerdown / touchstart / click を同時登録し、物理1タップの重複は時間窓で排除 ----
var lastDownMs=0;
function onTapAny(e){
if(e&&e.preventDefault)e.preventDefault();
var ms=Date.now(),isClick=false;
if(e&&e.type==="click")isClick=true;
if(isClick){if(ms-lastDownMs<500)return;}
else{if(ms-lastDownMs<50)return;lastDownMs=ms;}
var rx=W/2,ry=H/2;
if(e){if(typeof e.clientX==="number"){rx=e.clientX;ry=e.clientY;}
else if(e.touches&&e.touches[0]){rx=e.touches[0].clientX;ry=e.touches[0].clientY;}}
// 1) まずゲーム状態を更新（音声の成否に一切依存しない）
if(state==="title"){startGame();}
else if(state==="play"){tapPlay();}
else if(state==="result"){if(resultAge>0.7)startGame();}
// 2) タップの視覚フィードバック
tapRipple(rx,ry);
// 3) 音声の準備は最後。fail-open（失敗してもゲームは動き続ける）
try{initAudio();}catch(err){ac=null;master=null;noiseBuf=null;}
try{unlockAudio();}catch(err){}
}
window.addEventListener("pointerdown",onTapAny,{passive:false});
window.addEventListener("touchstart",onTapAny,{passive:false});
window.addEventListener("click",onTapAny);

// ================= 描画 =================
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function bigText(txt,x,y,size,col,alpha){
ctx.save();ctx.translate(x,y);ctx.globalAlpha=Math.max(0,Math.min(1,alpha));
ctx.font="900 "+size+"px "+FONT;
ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";
ctx.lineWidth=Math.max(4,size*0.12);ctx.strokeStyle="rgba(30,10,40,0.65)";
ctx.strokeText(txt,0,0);ctx.fillStyle=col;ctx.fillText(txt,0,0);ctx.restore();}
function drawBG(){
if(bgImg&&bgImg.ok){
var s=Math.max(W/bgImg.width,H/bgImg.height);
ctx.drawImage(bgImg,(W-bgImg.width*s)/2,(H-bgImg.height*s)/2,bgImg.width*s,bgImg.height*s);
ctx.fillStyle="rgba(18,6,30,0.32)";ctx.fillRect(0,0,W,H);
}else{
var g=ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0,"#ff9a3d");g.addColorStop(0.55,"#ff6b6b");g.addColorStop(1,"#c2255c");
ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(W/2,H*0.42);
for(var i=0;i<16;i++){
var a0=(i/16)*Math.PI*2+tGlobal*0.004,a1=a0+Math.PI/16;
ctx.fillStyle=i%2?"rgba(255,255,255,0.07)":"rgba(255,255,255,0)";
ctx.beginPath();ctx.moveTo(0,0);
ctx.lineTo(Math.cos(a0)*H,Math.sin(a0)*H);
ctx.lineTo(Math.cos(a1)*H,Math.sin(a1)*H);
ctx.closePath();ctx.fill();}
ctx.restore();}
var v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.75);
v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(20,5,25,0.4)");
ctx.fillStyle=v;ctx.fillRect(0,0,W,H);}
function drawPot(x,y,r,rot,alpha){
ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=Math.max(0,Math.min(1,alpha));
ctx.shadowColor="rgba(0,0,0,0.35)";ctx.shadowBlur=8;
if(potImg&&potImg.ok){ctx.drawImage(potImg,-r*1.2,-r*1.2,r*2.4,r*2.4);}
else{
ctx.fillStyle="#a5682f";ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();
ctx.fillStyle="#8a4f1d";ctx.beginPath();ctx.ellipse(0,-r*0.55,r*0.72,r*0.3,0,0,6.283);ctx.fill();
ctx.fillStyle="#c98a4b";ctx.beginPath();ctx.ellipse(-r*0.3,-r*0.05,r*0.16,r*0.28,-0.6,0,6.283);ctx.fill();}
ctx.restore();ctx.globalAlpha=1;}
function drawChar(x,y,s){
ctx.save();ctx.translate(x,y);
ctx.shadowColor="rgba(0,0,0,0.3)";ctx.shadowBlur=10;
if(charImg&&charImg.ok){ctx.drawImage(charImg,-s/2,-s/2,s,s);}
else{
ctx.fillStyle="#fff";
ctx.beginPath();ctx.arc(0,-s*0.05,s*0.3,0,6.283);ctx.fill();
ctx.beginPath();ctx.moveTo(-s*0.2,-s*0.27);ctx.lineTo(-s*0.32,-s*0.5);ctx.lineTo(-s*0.08,-s*0.34);ctx.closePath();ctx.fill();
ctx.beginPath();ctx.moveTo(s*0.2,-s*0.27);ctx.lineTo(s*0.32,-s*0.5);ctx.lineTo(s*0.08,-s*0.34);ctx.closePath();ctx.fill();
ctx.fillStyle="#e03131";ctx.fillRect(-s*0.3,-s*0.26,s*0.6,s*0.09);
ctx.strokeStyle="#212529";ctx.lineWidth=Math.max(2,s*0.02);ctx.lineCap="round";
ctx.beginPath();ctx.moveTo(-s*0.15,-s*0.08);ctx.lineTo(-s*0.04,-s*0.03);ctx.stroke();
ctx.beginPath();ctx.moveTo(s*0.15,-s*0.08);ctx.lineTo(s*0.04,-s*0.03);ctx.stroke();
ctx.fillStyle="#e03131";ctx.fillRect(-s*0.26,s*0.17,s*0.52,s*0.07);}
ctx.restore();}
function drawStage(now,beatPos,dt){
var hx=hitX(),py=potY(),pr=potR(),i;
ctx.fillStyle="rgba(0,0,0,0.3)";ctx.fillRect(0,py-pr-20,W,pr*2+40);
ctx.strokeStyle="rgba(255,255,255,0.6)";ctx.lineWidth=5;ctx.setLineDash([18,12]);
ctx.beginPath();ctx.moveTo(hx-10,py);ctx.lineTo(W+20,py);ctx.stroke();ctx.setLineDash([]);
var ph=beatPos>0?beatPos-Math.floor(beatPos):0.999;
ctx.fillStyle="rgba(255,255,255,0.12)";
ctx.beginPath();ctx.arc(hx,py,pr+4,0,6.283);ctx.fill();
ctx.strokeStyle="rgba(255,255,255,"+(0.7*(1-ph)).toFixed(3)+")";ctx.lineWidth=6;
ctx.beginPath();ctx.arc(hx,py,pr+4+ph*24,0,6.283);ctx.stroke();
ctx.strokeStyle="rgba(255,255,255,0.85)";ctx.lineWidth=3;
ctx.beginPath();ctx.arc(hx,py,pr+4,0,6.283);ctx.stroke();
for(i=0;i<notes.length;i++){var n=notes[i];
if(n.st===0){
var dt2=n.t-now;
if(dt2>0&&dt2<0.85){
var r3=pr+4+dt2/0.85*130;
ctx.strokeStyle="rgba(255,224,102,"+(0.65*(1-dt2/0.85)).toFixed(3)+")";ctx.lineWidth=3;
ctx.beginPath();ctx.arc(hx,py,r3,0,6.283);ctx.stroke();}
var x=hx+dt2/LEAD*(W-hx+90);
if(x<W+80)drawPot(x,py,pr,n.rot+dt2*3,1);
}else if(n.st===3){
var dt3=now-n.mt;
if(dt3<0.85)drawPot(hx-dt3*160,py+dt3*dt3*1500,pr,n.rot+dt3*9,1-dt3/0.85);}}
var s=charS();
var cx=Math.max(hx-s*0.5-pr-18,s*0.52),cy=py+s*0.26;
ctx.fillStyle="rgba(0,0,0,0.24)";
ctx.beginPath();ctx.ellipse(cx,cy+s*0.34,s*0.36,s*0.09,0,0,6.283);ctx.fill();
var jump=beatPos>0?Math.sin(ph*Math.PI)*Math.min(10,H*0.02):0;
punchT+=dt;
var lunge=0,rot=0;
if(punchT<0.22){var k=punchT/0.22;lunge=Math.sin(k*Math.PI)*Math.min(46,W*0.06);rot=-0.12*Math.sin(k*Math.PI);}
ctx.save();ctx.translate(cx+lunge,cy-jump);ctx.rotate(rot);
var sq=1+0.05*Math.sin(ph*Math.PI*2);ctx.scale(1/sq,sq);
drawChar(0,0,s);ctx.restore();}
function drawImpacts(dt){
ctx.globalCompositeOperation="lighter";
for(var i=impacts.length-1;i>=0;i--){var im=impacts[i];im.age+=dt;
var k=im.age/0.28;
if(k>=1){impacts.splice(i,1);continue;}
var r=(10+k*90)*(im.big?1.35:1);
ctx.save();ctx.translate(im.x,im.y);ctx.rotate(k*0.6);
ctx.globalAlpha=1-k;
ctx.fillStyle=im.big?"#ffe066":"#a5d8ff";
ctx.beginPath();
for(var j=0;j<16;j++){var rr2=j%2?r*0.35:r,an=j/16*Math.PI*2;
ctx.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2);}
ctx.closePath();ctx.fill();ctx.restore();}
ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";}
function drawParts(dt){
for(var i=parts.length-1;i>=0;i--){var p=parts[i];
p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr;p.l-=dt*1.2;
if(p.l<=0||p.y>H+40){parts.splice(i,1);continue;}
ctx.globalAlpha=Math.max(p.l,0);
if(p.spark){ctx.globalCompositeOperation="lighter";
ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.l,0,6.283);ctx.fill();
ctx.globalCompositeOperation="source-over";}
else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
ctx.fillStyle=p.col;ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*0.7);ctx.restore();}}
ctx.globalAlpha=1;}
function drawPops(dt){
var pf=Math.max(14,Math.min(30,H*0.08));
for(var i=pops.length-1;i>=0;i--){var p=pops[i];p.age+=dt;
if(p.age>0.85){pops.splice(i,1);continue;}
var k=Math.min(p.age/0.16,1),sc=(0.5+0.5*easeOutBack(k))*(p.big?1.35:1);
var a=p.age>0.55?1-(p.age-0.55)/0.3:1;
ctx.save();ctx.translate(p.x,p.y-p.age*28);ctx.scale(sc,sc);ctx.globalAlpha=Math.max(a,0);
ctx.font="900 "+pf+"px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";
ctx.lineWidth=6;ctx.strokeStyle="rgba(0,0,0,0.55)";ctx.strokeText(p.txt,0,0);
ctx.fillStyle=p.col;ctx.fillText(p.txt,0,0);ctx.restore();}
ctx.globalAlpha=1;}
function drawScoreHUD(){
var fs=Math.max(13,Math.min(20,H*0.05));
ctx.save();
ctx.font="900 "+fs+"px "+FONT;ctx.textAlign="left";ctx.textBaseline="middle";
var label="SCORE "+score,w=ctx.measureText(label).width;
var hh=fs+14;
ctx.fillStyle="rgba(15,8,28,0.5)";rr(10,10,w+28,hh,hh/2);ctx.fill();
ctx.lineWidth=3;ctx.lineJoin="round";ctx.strokeStyle="rgba(0,0,0,0.4)";
ctx.strokeText(label,24,10+hh/2+1);ctx.fillStyle="#fff";ctx.fillText(label,24,10+hh/2+1);
if(best>0){
var bl="BEST "+best,bfs=Math.max(11,fs*0.72);
ctx.font="800 "+bfs+"px "+FONT;
var bw2=ctx.measureText(bl).width+24,bh=bfs+10;
ctx.fillStyle="rgba(15,8,28,0.5)";rr(10,10+hh+6,bw2,bh,bh/2);ctx.fill();
ctx.strokeText(bl,22,10+hh+6+bh/2+1);ctx.fillStyle="#ffd43b";ctx.fillText(bl,22,10+hh+6+bh/2+1);}
ctx.restore();}
function drawTitle(){
var s=Math.min(Math.max(Math.min(W,H)*0.42,110),190);
var ph=(tGlobal*0.035)%1,jump=Math.abs(Math.sin(ph*Math.PI))*Math.min(14,H*0.03);
var x=W+120-((tGlobal*4)%(W+240));
drawPot(x,H*0.52+Math.sin(tGlobal*0.05)*26,potR(),tGlobal*0.1,0.9);
ctx.fillStyle="rgba(0,0,0,0.24)";
ctx.beginPath();ctx.ellipse(W/2,H*0.62+s*0.36,s*0.36,s*0.09,0,0,6.283);ctx.fill();
ctx.save();ctx.translate(W/2,H*0.62-jump);
var sq=1+0.06*Math.sin(ph*Math.PI*2);ctx.scale(1/sq,sq);
drawChar(0,0,s);ctx.restore();
var title="リズムカラテ",size=Math.min(Math.min(W*0.15,H*0.16),64),n=title.length;
var x0=W/2-(size*n*1.02)/2+size/2;
ctx.font="900 "+size+"px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";
for(var i=0;i<n;i++){
var yy=H*0.3+Math.sin(tGlobal*0.09+i*0.8)*Math.min(9,H*0.02);
ctx.lineWidth=size*0.16;ctx.strokeStyle="#d6336c";
ctx.strokeText(title.charAt(i),x0+i*size*1.02,yy);
ctx.fillStyle="#fff";ctx.fillText(title.charAt(i),x0+i*size*1.02,yy);}
ctx.font="800 "+Math.min(16,H*0.045)+"px "+FONT;
ctx.lineWidth=4;ctx.strokeStyle="rgba(0,0,0,0.5)";
ctx.strokeText("音楽に合わせてタップ！飛んでくるツボをぶっ叩け！",W/2,H*0.43);
ctx.fillStyle="rgba(255,255,255,0.95)";
ctx.fillText("音楽に合わせてタップ！飛んでくるツボをぶっ叩け！",W/2,H*0.43);
ctx.font="700 "+Math.min(13,H*0.036)+"px "+FONT;
ctx.strokeText("♪ 音を出してプレイしてね",W/2,H*0.475);
ctx.fillStyle="rgba(255,255,255,0.85)";
ctx.fillText("♪ 音を出してプレイしてね",W/2,H*0.475);
if(best>0){ctx.font="800 "+Math.min(15,H*0.04)+"px "+FONT;
ctx.strokeText("BEST "+best,W/2,H*0.525);
ctx.fillStyle="#ffd43b";ctx.fillText("BEST "+best,W/2,H*0.525);}
ctx.globalAlpha=0.55+0.45*Math.sin(tGlobal*0.1);
ctx.font="900 "+Math.min(22,H*0.06)+"px "+FONT;
ctx.lineWidth=5;ctx.strokeStyle="rgba(0,0,0,0.5)";
ctx.strokeText("― タップでスタート ―",W/2,H*0.82);
ctx.fillStyle="#fff";ctx.fillText("― タップでスタート ―",W/2,H*0.82);
ctx.globalAlpha=1;}
function drawResult(dt){
resultAge+=dt;
ctx.fillStyle="rgba(15,8,30,0.66)";ctx.fillRect(-60,-60,W+120,H+120);
var k=Math.min(resultAge/0.45,1),e=easeOutBack(k);
var pw=Math.min(W*0.88,430),phh=Math.min(H*0.72,560);
var px=(W-pw)/2,py=(H-phh)/2;
ctx.save();ctx.globalAlpha=Math.min(1,resultAge*3);
ctx.fillStyle="rgba(255,255,255,0.97)";rr(px,py,pw,phh,24);ctx.fill();
ctx.textAlign="center";ctx.textBaseline="middle";
ctx.font="900 "+Math.min(26,phh*0.06)+"px "+FONT;ctx.fillStyle="#2b2b3d";
ctx.fillText("リザルト",W/2,py+phh*0.1);
var rc=RANKCOL[rank];
ctx.save();ctx.translate(W/2,py+phh*0.3);ctx.scale(e,e);
ctx.rotate(Math.sin(tGlobal*0.05)*0.05);
ctx.font="900 "+Math.min(110,phh*0.24)+"px "+FONT;ctx.fillStyle=rc;
ctx.shadowColor=rc;ctx.shadowBlur=24;
ctx.fillText(rank,0,0);ctx.restore();
ctx.font="700 "+Math.min(18,phh*0.042)+"px "+FONT;ctx.fillStyle="#495057";
var ly=py+phh*0.52;
ctx.fillText("パーフェクト "+counts.p+"　グッド "+counts.g,W/2,ly);
ctx.fillText("ミス "+counts.m+"　最大コンボ "+maxCombo,W/2,ly+phh*0.07);
ctx.font="900 "+Math.min(42,phh*0.09)+"px "+FONT;ctx.fillStyle="#212529";
ctx.fillText(score,W/2,ly+phh*0.16);
ctx.font="700 "+Math.min(14,phh*0.032)+"px "+FONT;ctx.fillStyle="#868e96";
ctx.fillText("SCORE　　BEST "+best,W/2,ly+phh*0.22);
if(resultAge>0.7){
ctx.globalAlpha=(0.55+0.45*Math.sin(tGlobal*0.12))*Math.min(1,resultAge*3);
ctx.font="800 "+Math.min(20,phh*0.045)+"px "+FONT;ctx.fillStyle="#e8590c";
ctx.fillText("タップでもう一度",W/2,py+phh*0.92);}
ctx.restore();ctx.globalAlpha=1;}

var lastNow=0,lastFrameMs=0;
function frame(){
var now=nowT();
var dt=lastNow?now-lastNow:0.016;
if(dt>0.05)dt=0.05;if(dt<0)dt=0;
lastNow=now;lastFrameMs=Date.now();
tGlobal+=dt*60;
ctx.setTransform(D,0,0,D,0,0);
var i;
drawBG();
if(trauma>0){var sh=trauma*trauma*14;trauma=Math.max(0,trauma-dt*1.8);
ctx.translate((Math.random()-0.5)*sh,(Math.random()-0.5)*sh);}
if(state==="title"){drawTitle();drawParts(dt);drawScoreHUD();return;}
var beatPos=(now-songStartP)/BEAT;
if(prevBeat<CI&&beatPos>=CI)goFlash=1;
prevBeat=beatPos;
if(state==="play"){
for(i=0;i<notes.length;i++){var nt=notes[i];
if(nt.st===0&&now-nt.t>GOODWIN){nt.st=3;nt.mt=now;counts.m++;combo=0;
pops.push({txt:"ミス…",col:"#adb5bd",age:0,x:hitX(),y:popY(),big:false});missSfx();}}
drawStage(now,beatPos,dt);
drawImpacts(dt);drawParts(dt);drawPops(dt);
drawScoreHUD();
if(combo>=2){
var cs=1+0.35*Math.max(0,1-(now-lastComboAt)*5);
ctx.save();ctx.translate(W/2,H*0.16);ctx.scale(cs,cs);
ctx.font="900 "+Math.min(46,H*0.12)+"px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";
ctx.lineWidth=8;ctx.strokeStyle="rgba(30,10,40,0.65)";ctx.strokeText(combo,0,0);
ctx.fillStyle="#fff";ctx.fillText(combo,0,0);
ctx.font="800 "+Math.min(16,H*0.045)+"px "+FONT;ctx.lineWidth=4;ctx.strokeText("コンボ",0,Math.min(32,H*0.08));
ctx.fillStyle="#ffd43b";ctx.fillText("コンボ",0,Math.min(32,H*0.08));ctx.restore();}
if(beatPos>=0&&beatPos<CI){
var num=CI-1-Math.floor(beatPos);
if(num>=1){var ph2=beatPos-Math.floor(beatPos);
bigText(num,W/2,H*0.36,Math.min(90,H*0.24)*(1.4-0.5*ph2),"#fff",1-ph2*0.25);}}
if(goFlash>0){goFlash-=dt*1.5;
bigText("GO!",W/2,H*0.36,Math.min(110,H*0.28)*(1.35-goFlash*0.35),"#ffd43b",Math.min(Math.max(goFlash,0)*1.6,1));}
var frac=Math.max(0,Math.min(1,(now-songStartP)/(SONG_BEATS*BEAT)));
var bw=Math.min(W*0.55,400),bx=(W-bw)/2,by=Math.max(12,H*0.05);
ctx.fillStyle="rgba(0,0,0,0.35)";rr(bx,by,bw,10,5);ctx.fill();
if(frac>0){ctx.fillStyle="#ffd43b";rr(bx+2,by+2,Math.max((bw-4)*frac,6),6,3);ctx.fill();}
if(beatPos>SONG_BEATS+1.5)showResult();
}else if(state==="result"){
drawStage(now,beatPos,dt);
drawParts(dt);drawPops(dt);
drawResult(dt);}}
// メインループ：rAF + 監視interval（rAFが止まる環境でも必ず進む）
function loop(){try{frame();}catch(e){}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
setInterval(function(){
if(Date.now()-lastFrameMs>200){try{frame();}catch(e){}}
},100);
})();
</script>
